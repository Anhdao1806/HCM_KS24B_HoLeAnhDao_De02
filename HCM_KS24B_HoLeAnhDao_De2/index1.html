<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Mục Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="Title">Quản Lý Danh Mục Sách</h1>
        <div class="card p-4 mb-4">
            <div class="mb-3">
                <div class="display">
                <label for="bookTitle" class="form-label" id="nameBook">Tên sách:</label>
                <input type="text" class="form-control" id="bookTitle">
            </div>
                <div id="nameBook" class="form-text">Không được bỏ trống</div>
            </div>
            <div class="mb-3">
                <div class="display">
                <label for="author" class="form-label" id = "author">Tác giả:</label>
                <input type="text" class="form-control" id="author">
            </div>
                <div id="nameBook" class="form-text">Không được bỏ trống</div>
            </div>
            <div class="mb-3">
                <div class="display">
                <label for="year" class="form-label" id = "year">Năm xuất bản:</label>
                <input type="text" class="form-control" id="year">
            </div>
                <div id="day" class="form-text">Phải là năm hợp lệ</div>
            </div>
            <div class="mb-3">
                <div class="display">
                <label for="genre" class="form-label" id="category">Thể loại:</label>
                <input type="text" class="form-control" id="genre">
            </div>
                <div id="nameBook" class="form-text">Không được bỏ trống</div>
            </div>
            <div class="d-flex gap-2">
                <button id="addBookBtn" class="addBook">Thêm sách</button>
            </div>
        </div>
        <div class="input-group mb-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm theo tên sách...">
        </div>
        <div class="table-responsive">
            <table id="bookTable" class="table table-bordered table-hover">
                <thead class="table-header">
                    <tr>
                        <th>Tên sách</th>
                        <th>Tác giả</th>
                        <th>Năm</th>
                        <th>Thể loại</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="bookTableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
